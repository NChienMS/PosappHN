<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>In QR Tingbox S</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<style>
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  background: #f4f6f8;
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.uploader {
  border-bottom: 1px solid #ddd;
  padding: 12px;
  background: #fff;
}
.controls {
  margin-top: 8px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
button {
  cursor: pointer;
  padding: 6px 14px;
  border: none;
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  color: white;
  border-radius: 4px;
  font-size: 14px;
  transition: 0.2s;
}
button:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
@page { size: A4 landscape; margin: 10mm; }
.a4-sheet { display: none; }
.a4-sheet.printable {
  display: block;
  width: 297mm;
  height: 210mm;
  box-sizing: border-box;
  padding: 10mm;
  background: white;
}
.qr-grid {
  display: grid;
  grid-template-columns: repeat(4, 6cm);
  grid-template-rows: repeat(3, 6cm);
  grid-gap: 6mm;
  justify-content: center;
  align-content: start;
}
.qr-grid .cell {
  width: 6cm;
  height: 6cm;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.qr-grid img { width: 100%; height: 100%; object-fit: contain; display: block; }

.preview-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
}
.preview-a4 {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  padding: 8px;
  max-width: 100%;
  max-height: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.preview-a4 .a4-sheet {
  transform-origin: top center;
}

/* Popup crop fullscreen */
.cropper-popup {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.9);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.cropper-popup.active { display: flex; }
.cropper-popup img {
  max-width: none !important;
  max-height: none !important;
}
.cropper-buttons {
  position: fixed;
  bottom: 20px;
  display: flex;
  gap: 10px;
}
.cropper-buttons button {
  padding: 8px 16px;
  border: none;
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  color: white;
  border-radius: 4px;
  font-size: 14px;
  transition: 0.2s;
}
.cropper-buttons button:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
@media print {
  body * { visibility: hidden; }
  .a4-sheet.printable, .a4-sheet.printable * { visibility: visible; }
  .a4-sheet.printable { position: fixed; left: 0; top: 0; }
}
</style>
</head>
<body>
<div class="uploader">
  <img src="https://ariesvn8.wordpress.com/wp-content/uploads/2025/07/np-logo.png" width="150px" alt="Logo" class="uploader-logo">
  <h3>In QR Tingbox S</h3>
  <input id="file" type="file" accept="image/*"><br>
  <div class="controls">
    <button id="print-btn" disabled>In</button>
    <button id="download-png" disabled>Tải PNG</button>
    <button id="share-btn" disabled>Chia sẻ</button>
    <button id="reset-btn">Reset</button>
  </div>
</div>

<div class="preview-wrapper">
  <div class="preview-a4">
    <div id="a4-preview" class="a4-sheet"></div>
  </div>
</div>

<canvas id="composeCanvas" style="display:none"></canvas>

<!-- Popup Crop -->
<div id="cropper-popup" class="cropper-popup">
  <img id="cropper-image" alt="crop source">
  <div class="cropper-buttons">
    <button id="confirm-crop">Cắt</button>
    <button id="cancel-crop">Hủy</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
const fileInput = document.getElementById('file');
const printBtn = document.getElementById('print-btn');
const downloadBtn = document.getElementById('download-png');
const shareBtn = document.getElementById('share-btn');
const resetBtn = document.getElementById('reset-btn');
const a4Preview = document.getElementById('a4-preview');
const composeCanvas = document.getElementById('composeCanvas');

const popup = document.getElementById('cropper-popup');
const cropperImage = document.getElementById('cropper-image');
const confirmCropBtn = document.getElementById('confirm-crop');
const cancelCropBtn = document.getElementById('cancel-crop');

let cropper = null;
let uploadedImageURL = '';
let lastCroppedImage = null;

fileInput.addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  uploadedImageURL = URL.createObjectURL(file);
  openCrop();
});

function openCrop(){
  cropperImage.src = uploadedImageURL;
  popup.classList.add('active');
  setTimeout(()=>{
    if (cropper) cropper.destroy();
    cropper = new Cropper(cropperImage, {
      aspectRatio: 1,
      viewMode: 0,
      dragMode: 'move',
      cropBoxMovable: false,
      cropBoxResizable: false,
      autoCropArea: 1,
      background: false,
      ready() {
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        cropper.setCropBoxData({
          left: (window.innerWidth - size) / 2,
          top: (window.innerHeight - size) / 2,
          width: size,
          height: size
        });
        cropper.zoomTo(1);
      }
    });
  }, 50);
}

cancelCropBtn.addEventListener('click', ()=>{
  popup.classList.remove('active');
  if (cropper) cropper.destroy();
});

confirmCropBtn.addEventListener('click', ()=>{
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({
    width: 1200, height: 1200, imageSmoothingQuality: 'high'
  });
  lastCroppedImage = canvas.toDataURL('image/png');
  popup.classList.remove('active');
  cropper.destroy();
  buildA4Preview(lastCroppedImage);
  prepareA4PNG(lastCroppedImage);
  printBtn.disabled = false;
  downloadBtn.disabled = false;
  shareBtn.disabled = false;
});

function buildA4Preview(dataURL){
  a4Preview.innerHTML = '';
  a4Preview.classList.add('printable');
  const grid = document.createElement('div');
  grid.className = 'qr-grid';
  for(let i=0;i<12;i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    const img = document.createElement('img');
    img.src = dataURL;
    cell.appendChild(img);
    grid.appendChild(cell);
  }
  a4Preview.appendChild(grid);
  const previewBox = document.querySelector('.preview-a4');
  const scale = Math.min(
    previewBox.clientWidth / a4Preview.offsetWidth,
    previewBox.clientHeight / a4Preview.offsetHeight
  );
  a4Preview.style.transform = `scale(${scale})`;
}

printBtn.addEventListener('click', ()=>{
  if (!lastCroppedImage) return;
  setTimeout(()=> window.print(), 300);
});

downloadBtn.addEventListener('click', ()=>{
  const dataURL = composeCanvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'a4_qr_sheet.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

shareBtn.addEventListener('click', ()=>{
  composeCanvas.toBlob(blob=>{
    const file = new File([blob], 'a4_qr_sheet.png', {type: 'image/png'});
    if (navigator.share) {
      navigator.share({
        files: [file],
        title: 'QR A4',
        text: 'Trang A4 chứa mã QR'
      });
    } else {
      alert('Trình duyệt không hỗ trợ chia sẻ trực tiếp.');
    }
  });
});

resetBtn.addEventListener('click', ()=>{
  location.reload();
});

function prepareA4PNG(dataURL){
  const DPI = 300;
  const mmToInch = mm => mm/25.4;
  const wMM = 297, hMM = 210;
  const canvasW = Math.round(mmToInch(wMM) * DPI);
  const canvasH = Math.round(mmToInch(hMM) * DPI);
  composeCanvas.width = canvasW;
  composeCanvas.height = canvasH;
  const ctx = composeCanvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvasW,canvasH);
  const cellCM = 6.0;
  const gapMM = 6.0;
  const cellPx = mmToInch(cellCM*10) * DPI;
  const gapPx = mmToInch(gapMM) * DPI;
  const pagePaddingMM = 10;
  const padPx = mmToInch(pagePaddingMM) * DPI;
  const gridW = 4 * cellPx + 3 * gapPx;
  const startX = (canvasW - gridW) / 2;
  const startY = padPx;
  const img = new Image();
  img.onload = ()=>{
    for(let r=0;r<3;r++){
      for(let c=0;c<4;c++){
        const x = startX + c*(cellPx + gapPx);
        const y = startY + r*(cellPx + gapPx);
        const iw = img.width, ih = img.height;
        const scale = Math.min(cellPx/iw, cellPx/ih);
        const dw = iw*scale, dh = ih*scale;
        const dx = x + (cellPx - dw)/2;
        const dy = y + (cellPx - dh)/2;
        ctx.drawImage(img, dx, dy, dw, dh);
      }
    }
  }
  img.src = dataURL;
}
</script>
</body>
</html>
