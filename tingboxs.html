<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>In QR Tingbox S</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<link rel="icon" type="image/png" href="https://ariesvn8.wordpress.com/wp-content/uploads/2025/07/np-logo.png">
<style>
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  background: #f4f6f8;
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.uploader {
  border-bottom: 1px solid #ddd;
  padding: 12px;
  background: #fff;
}
.textsl{
  color: black;
}
.controls {
  margin-top: 8px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
button, select {
  cursor: pointer;
  padding: 6px 14px;
  border: none;
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  color: white;
  border-radius: 4px;
  font-size: 14px;
  transition: 0.2s;
}
button:hover, select:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
select {
  background: linear-gradient(135deg, #6dd5ed 0%, #2193b0 100%);
}
.a4-sheet, .sheet-57, .sheet-80 {
  display: none;
  background: white;
}
.a4-sheet.printable {
  display: block;
  width: 297mm;
  height: 210mm;
  padding: 10mm;
  box-sizing: border-box;
}
.sheet-57.printable {
  display: block;
  width: 57mm;
  height: 57mm;
  padding: 0;
}
.sheet-80.printable {
  display: block;
  width: 80mm;
  height: 80mm;
  padding: 0;
}
.qr-grid {
  display: grid;
  grid-template-columns: repeat(4, 6cm);
  grid-template-rows: repeat(3, 6cm);
  grid-gap: 6mm;
  justify-content: center;
  align-content: start;
}
.cell {
  width: 6cm;
  height: 6cm;
  display: flex;
  justify-content: center;
  align-items: center;
}
.cell img { width: 100%; height: 100%; object-fit: contain; }
.qr-single {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.qr-single img {
  display: block;
  object-fit: contain;
}
.preview-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
}
.preview-a4 {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  padding: 8px;
  max-width: 100%;
  max-height: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.preview-a4 .printable {
  transform-origin: top center;
}
.cropper-popup {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.9);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.cropper-popup.active { display: flex; }
.cropper-popup img {
  max-width: none !important;
  max-height: none !important;
}
.cropper-buttons {
  position: fixed;
  bottom: 20px;
  display: flex;
  gap: 10px;
}
.cropper-buttons button {
  padding: 8px 16px;
  border: none;
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  color: white;
  border-radius: 4px;
  font-size: 14px;
  transition: 0.2s;
}
.cropper-buttons button:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
@media print {
  body * { visibility: hidden; }
  .printable, .printable * { visibility: visible; }
  .printable { position: fixed; left: 0; top: 0; }
}
</style>
</head>
<body>
<div class="uploader">
  <img src="https://ariesvn8.wordpress.com/wp-content/uploads/2025/07/np-logo.png" width="150px" alt="Logo">
  <h3>In QR Tingbox S</h3>
    <select style="margin: 0 0 5px 0;" id="print-type">
      <option class="textsl" value="a4">In A4</option>
      <option class="textsl" value="57">In khổ 57mm</option>
      <option class="textsl" value="80">In khổ 80mm</option>
    </select>
<br>
  <input id="file" type="file" accept="image/*"><br>
  <div class="controls">
    <button id="print-btn" disabled>In</button>
    <button id="download-png" disabled>Tải PNG</button>
    <button id="share-btn" disabled>Chia sẻ</button>
    <button id="reset-btn">Reset</button>
  </div>
</div>

<div class="preview-wrapper">
  <div class="preview-a4">
    <div id="a4-preview"></div>
  </div>
</div>

<canvas id="composeCanvas" style="display:none"></canvas>

<div id="cropper-popup" class="cropper-popup">
  <img id="cropper-image" alt="crop source">
  <div class="cropper-buttons">
    <button id="confirm-crop">Cắt</button>
    <button id="cancel-crop">Hủy</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
const fileInput = document.getElementById('file');
const printBtn = document.getElementById('print-btn');
const downloadBtn = document.getElementById('download-png');
const shareBtn = document.getElementById('share-btn');
const resetBtn = document.getElementById('reset-btn');
const printType = document.getElementById('print-type');
const a4Preview = document.getElementById('a4-preview');
const composeCanvas = document.getElementById('composeCanvas');
const popup = document.getElementById('cropper-popup');
const cropperImage = document.getElementById('cropper-image');
const confirmCropBtn = document.getElementById('confirm-crop');
const cancelCropBtn = document.getElementById('cancel-crop');

let cropper = null;
let uploadedImageURL = '';
let lastCroppedImage = null;

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  uploadedImageURL = URL.createObjectURL(file);
  openCrop();
});

function openCrop(){
  cropperImage.src = uploadedImageURL;
  popup.classList.add('active');
  setTimeout(()=>{
    if (cropper) cropper.destroy();
    cropper = new Cropper(cropperImage, {
      aspectRatio: 1,
      viewMode: 0,
      dragMode: 'move',
      cropBoxMovable: false,
      cropBoxResizable: false,
      autoCropArea: 1,
      background: false
    });
  }, 50);
}

cancelCropBtn.addEventListener('click', ()=>{
  popup.classList.remove('active');
  if (cropper) cropper.destroy();
});

confirmCropBtn.addEventListener('click', ()=>{
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width: 1200, height: 1200, imageSmoothingQuality: 'high' });
  lastCroppedImage = canvas.toDataURL('image/png');
  popup.classList.remove('active');
  cropper.destroy();
  buildPreview(lastCroppedImage);
  preparePNG(lastCroppedImage);
  printBtn.disabled = false;
  downloadBtn.disabled = false;
  shareBtn.disabled = false;
});

function buildPreview(dataURL){
  a4Preview.innerHTML = '';
  const type = printType.value;
  let sheet;

  if(type === 'a4'){
    sheet = document.createElement('div');
    sheet.className = 'a4-sheet printable';
    const grid = document.createElement('div');
    grid.className = 'qr-grid';
    for(let i=0;i<12;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      const img = document.createElement('img');
      img.src = dataURL;
      cell.appendChild(img);
      grid.appendChild(cell);
    }
    sheet.appendChild(grid);

  } else if(type === '80'){
    sheet = document.createElement('div');
    sheet.className = 'sheet-80 printable';
    const box = document.createElement('div');
    box.className = 'qr-single';
    const img = document.createElement('img');
    img.src = dataURL;
    img.style.width = '60mm';
    img.style.height = '60mm';
    box.appendChild(img);
    sheet.appendChild(box);

  } else if(type === '57'){
    sheet = document.createElement('div');
    sheet.className = 'sheet-57 printable';
    const box = document.createElement('div');
    box.className = 'qr-single';
    const img = document.createElement('img');
    img.src = dataURL;
    img.style.width = '50mm';
    img.style.height = '50mm';
    box.appendChild(img);
    sheet.appendChild(box);
  }

  a4Preview.appendChild(sheet);

  const previewBox = document.querySelector('.preview-a4');
  const scale = Math.min(
    previewBox.clientWidth / sheet.offsetWidth,
    previewBox.clientHeight / sheet.offsetHeight
  );
  sheet.style.transform = `scale(${scale})`;
}

function preparePNG(dataURL){
  const DPI = 300;
  const mmToInch = mm => mm / 25.4;
  const type = printType.value;
  let wMM, hMM, qrMM;

  if(type === 'a4'){ wMM = 297; hMM = 210; qrMM = 60; }
  else if(type === '80'){ wMM = hMM = 80; qrMM = 60; }
  else if(type === '57'){ wMM = hMM = 57; qrMM = 50; }

  const canvasW = Math.round(mmToInch(wMM) * DPI);
  const canvasH = Math.round(mmToInch(hMM) * DPI);
  composeCanvas.width = canvasW;
  composeCanvas.height = canvasH;
  const ctx = composeCanvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvasW,canvasH);

  const img = new Image();
  img.onload = ()=>{
    if(type === 'a4'){
      const cellPx = mmToInch(qrMM) * DPI;
      const gapPx = mmToInch(6) * DPI;
      const padPx = mmToInch(10) * DPI;
      const gridW = 4 * cellPx + 3 * gapPx;
      const startX = (canvasW - gridW) / 2;
      const startY = padPx;
      for(let r=0;r<3;r++){
        for(let c=0;c<4;c++){
          const x = startX + c*(cellPx + gapPx);
          const y = startY + r*(cellPx + gapPx);
          ctx.drawImage(img, x, y, cellPx, cellPx);
        }
      }
    } else {
      const qrPx = mmToInch(qrMM) * DPI;
      const x = (canvasW - qrPx) / 2;
      const y = (canvasH - qrPx) / 2;
      ctx.drawImage(img, x, y, qrPx, qrPx);
    }
  }
  img.src = dataURL;
}

printBtn.addEventListener('click', ()=> window.print());

downloadBtn.addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = composeCanvas.toDataURL('image/png');
  a.download = 'qr_print.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

shareBtn.addEventListener('click', ()=>{
  composeCanvas.toBlob(blob=>{
    const file = new File([blob], 'qr_print.png', {type: 'image/png'});
    if (navigator.share) {
      navigator.share({ files: [file], title: 'QR Print' });
    } else {
      alert('Trình duyệt không hỗ trợ chia sẻ trực tiếp.');
    }
  });
});

resetBtn.addEventListener('click', ()=> location.reload());
</script>
</body>
</html>
