<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ping LAN & Đổi IP Máy In (không cần Internet)</title>
  <style>
    :root { --bg: #0f172a; --card:#111827; --muted:#94a3b8; --text:#e5e7eb; --accent:#22c55e; --warn:#f59e0b; --danger:#ef4444; }
    *{box-sizing:border-box}
    body{margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:linear-gradient(120deg,#0b1225,#0f172a 30%,#0b1225); color:var(--text)}
    .wrap{max-width:980px;margin:32px auto;padding:16px}
    h1{font-size:28px;margin:0 0 12px}
    .sub{color:var(--muted);margin-bottom:20px}
    .card{background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.25)}
    label{font-size:16px;color:var(--white);display:block;margin-bottom:6px}
    input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:#0b1020;color:var(--text);}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
    .ip-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .ip-row input { flex-grow: 1; margin-bottom: 0; }
    .ip-row button { margin-bottom: 0; }
    .ip-row .status-icon {
        font-size: 20px;
        line-height: 1;
        margin-left: 0px;
        width: 20px;
        text-align: center;
    }
    button{appearance:none;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
    .btn{background:#1f2937;color:#fff}
    .btn:hover{filter:brightness(1.15)}
    .btn-acc{background:var(--accent)}
    .btn-acc:hover{filter:brightness(1.15)}
    .btn-warn{background:var(--warn)}
    .btn-dan{background:var(--danger)}
    .muted{color:var(--muted)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .log{white-space:pre-wrap; background:#0b1020; border:1px dashed rgba(255,255,255,0.14); padding:12px; border-radius:12px; min-height:80px}
    .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:999px;background:#111827;border:1px solid rgba(255,255,255,0.08)}
    .ok{color:#10b981}.bad{color:#ef4444}.wait{color:#f59e0b}
    .small{font-size:12px}
    .link{color:#60a5fa;text-decoration:none}
    .link:hover{text-decoration:underline}
    .form-group{margin-bottom:16px}
    .form-group label{display:block}
    .form-col{display:flex;flex-direction:column;gap:0px;width:100%}
    .error { border-color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    
    <div class="card">
        <div class="form-col">
            <div class="form-group">
                <label>1) IP máy in <b>hiện tại</b></label>
                <div class="ip-row">
                    <input id="ipCurrent" placeholder="vd: 192.168.0.168" type="text" onkeydown="noSpace(event)" oninput="resetValidation()"/>
                    <button class="btn" onclick="pingFromInput('ipCurrent')">Ping</button>
                    <span id="pingStatusCurrent" class="status-icon"></span>
                </div>
            </div>
            <div class="form-group">
                <label>2) IP máy in <b>muốn đổi</b></label>
                <div class="ip-row">
                    <input id="ipTarget" placeholder="vd: 192.168.0.200" type="text" onkeydown="noSpace(event)" oninput="resetValidation()"/>
                    <button class="btn" onclick="pingFromInput('ipTarget')">Ping</button>
                    <span id="pingStatusTarget" class="status-icon"></span>
                </div>
            </div>
            <div class="form-group">
                <label>3) Subnet Mask</label>
                <input id="mask" value="255.255.255.0" style="margin-bottom:12px;" type="text" onkeydown="noSpace(event)" oninput="resetValidation()"/>
            </div>
            <div class="form-group">
                <label>4) Gateway</label>
                <input id="gw" value="192.168.0.1" style="margin-bottom:12px;" type="text" onkeydown="noSpace(event)" oninput="resetValidation()"/>
            </div>
            <div class="row" style="margin-bottom:0;">
                <button class="btn btn-acc" onclick="applyChangeAndReboot()">Xác nhận</button>
                <button class="btn btn-warn" onclick="rebootPrinter()">Khởi động lại</button>
                <button class="btn" onclick="previewUrl()">Xem URL lệnh</button>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:12px">
      <label>Trạng thái</label>
      <div id="status" class="row" style="gap:8px;margin-bottom:8px"></div>
      <div id="log" class="log small"></div>
    </div>


  </div>

<script>
  // === Helpers ===
  const $ = (id)=>document.getElementById(id);

  function isValidIP(ip){
    const m = ip.trim().match(/^([0-9]{1,3}\.){3}[0-9]{1,3}$/);
    if(!m) return false;
    return ip.split('.').every(o=>{const n=+o; return n>=0 && n<=255});
  }
  function toOctets(ip){ return ip.split('.').map(x=>parseInt(x,10)); }

  function badge(text, cls){
    const span=document.createElement('span');
    span.className='pill '+(cls||'');
    span.textContent=text; return span;
  }
  
  // Biến đếm toàn cục cho log
  let logCounter = 0;
  
  function log(msg){
    const area = $('log');
    logCounter++; // Tăng số đếm
    area.textContent = `[${logCounter}] [${new Date().toLocaleTimeString()}] ${msg}\n${area.textContent}`;
  }
  function setStatus(items){
    const s=$('status'); s.innerHTML='';
    items.forEach(i=>s.appendChild(i));
  }

  // Ngăn khoảng trắng khi gõ phím
  function noSpace(event) {
    if (event.key === ' ') {
      event.preventDefault();
    }
  }

  // New function to validate inputs
  function validateInputs(){
      let isValid = true;
      const inputs = [$('ipCurrent'), $('ipTarget'), $('mask'), $('gw')];
      inputs.forEach(input => {
          if (!input.value.trim()){
              input.classList.add('error');
              isValid = false;
          } else {
              input.classList.remove('error');
          }
      });
      return isValid;
  }
  
  // New function to reset validation styles on input
  function resetValidation(){
      const inputs = [$('ipCurrent'), $('ipTarget'), $('mask'), $('gw')];
      inputs.forEach(input => {
          input.classList.remove('error');
      });
  }

  // === Ping via <img> race (HTTP only, ICMP không khả dụng trong trình duyệt) ===
function pingIP(ip, timeout=3000){
  return new Promise((resolve)=>{
    if(!isValidIP(ip)) return resolve({ok:false, reason:"IP không hợp lệ"});
    let done = false;
    const url = `http://${ip}/ip_config.htm?t=${Date.now()}`;

    const img = new Image();
    img.onload = ()=>finish(true);
    img.onerror = ()=>finish(true);
    img.src = url;

    function finish(ok){
      if(done) return;
      done = true;
      resolve({ok});
    }
    setTimeout(()=>finish(false), timeout);
  });
}

  async function pingFromInput(id){
    const ip = $(id).value.trim();
    const statusIcon = $(`pingStatus${id.replace('ip', '')}`);
    
    // Xóa trạng thái cũ
    statusIcon.textContent = '';
    statusIcon.style.color = '';
    
    if(!isValidIP(ip)){
      setStatus([badge('IP không hợp lệ','bad')]);
      log('Sai định dạng IP: '+ip);
      statusIcon.textContent = '✖';
      statusIcon.style.color = 'var(--danger)';
      return;
    }

    setStatus([badge('Đang ping '+ip,'wait')]);
    const res = await pingIP(ip);
    if(res.ok){
      setStatus([badge('OK '+ip,'ok')]);
      log('Ping '+ip+' thành công');
      statusIcon.textContent = '✔';
      statusIcon.style.color = 'var(--accent)';
    } else {
      setStatus([badge('FAIL '+ip,'bad')]);
      log('Ping '+ip+' thất bại');
      statusIcon.textContent = '✖';
      statusIcon.style.color = 'var(--danger)';
    }
  }

  // === Build config URL ===
  function buildChangeUrl(){
    // Validate inputs before building URL
    if(!validateInputs()){
        throw new Error('Vui lòng điền đầy đủ các trường.');
    }
    const ipCur = $('ipCurrent').value.trim();
    const ipNew = $('ipTarget').value.trim();
    const mask = $('mask').value.trim();
    const gw = $('gw').value.trim();
    if(!isValidIP(ipCur) || !isValidIP(ipNew) || !isValidIP(mask) || !isValidIP(gw)){
      throw new Error('Vui lòng nhập đúng: IP hiện tại / IP mới / Mask / Gateway');
    }
    const [a,b,c,d] = toOctets(ipNew);
    const [m1,m2,m3,m4] = toOctets(mask);
    const [g1,g2,g3,g4] = toOctets(gw);
    const base = `http://${ipCur}/ip_config.htm`;
    const qs = new URLSearchParams({
      dhcp_mode:'0',
      IP_1:String(a), IP_2:String(b), IP_3:String(c), IP_4:String(d),
      MASK_1:String(m1), MASK_2:String(m2), MASK_3:String(m3), MASK_4:String(m4),
      GW_IP_1:String(g1), GW_IP_2:String(g2), GW_IP_3:String(g3), GW_IP_4:String(g4),
      __use_dhcp:'0',
      save:' Save '
    });
    return base + '?' + qs.toString();
  }

  function previewUrl(){
    try{
      const url = buildChangeUrl();
      // $('preview').textContent = url;
      log('Xem URL lệnh: '+url);
    }catch(e){ setStatus([badge('Lỗi dữ liệu','bad')]); log(e.message); }
  }

  function applyChangeAndReboot(){
    try{
        if(!validateInputs()){
            setStatus([badge('Lỗi dữ liệu','bad')]);
            log('Vui lòng điền đầy đủ các trường.');
            return;
        }
        const url = buildChangeUrl();
        window.open(url, '_blank');
        setStatus([badge('Đã gửi lệnh đổi IP', 'ok')]);
        log('Đã mở tab mới để gửi lệnh đổi IP. Vui lòng kiểm tra và đóng tab này sau khi hoàn tất.');
        log('Để reboot, vui lòng nhấn nút Reboot riêng.');
    }catch(e){ setStatus([badge('Lỗi dữ liệu','bad')]); log(e.message); }
  }

  function rebootPrinter(){
    const ipCur = $('ipCurrent').value.trim();
    if(!isValidIP(ipCur)){ 
      setStatus([badge('IP hiện tại không hợp lệ','bad')]);
      log('Sai định dạng IP hiện tại'); 
      return; 
    }
    const url = `http://${ipCur}/reset_prt.htm?reboot`;
    window.open(url,'_blank');
    setStatus([badge('Gửi lệnh reboot (mở tab mới)','warn')]);
    log('Đã gửi lệnh reboot đến: '+url);
  }
  
  function resetPrinter(){
    const ipCur = $('ipCurrent').value.trim();
    if(!isValidIP(ipCur)){ setStatus([badge('IP hiện tại không hợp lệ','bad')]); log('Sai định dạng IP hiện tại'); return; }
    const url = `http://${ipCur}/reset_prt.htm?reboot`;
    window.open(url,'_blank');
    setStatus([badge('Gửi lệnh reboot (mở tab mới)','warn')]);
    log('Reboot: '+url);
  }
</script>
</body>
</html>
