    :root {
      --bg: #0b1020;
      --text: #e5e7eb;
      --accent1: #4f46e5;
      --accent2: #06b6d4;
      --muted: #9ca3af;
    }
    html[data-theme='light'] {
      --bg: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--accent1) 25%, transparent), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 55%),
        var(--bg);
      background-attachment: fixed;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      text-align: center;
      overflow: hidden;
    }
    .gear {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: spin 6s linear infinite;
      fill: var(--accent2);
      opacity: 0.9;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 4em;
      margin: 0;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      color: transparent;
    }
    p {
      color: var(--muted);
      margin-top: 10px;
      font-size: 1.1em;
    }
    a.btn {
      display: inline-block;
      margin-top: 25px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white;
      padding: 10px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    a.btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9em;
      color: var(--muted);
    }
  </style>
