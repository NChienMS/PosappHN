<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Tem Nhãn</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style>
    @media print {
        body * {
            visibility: hidden;
        }
        #print-area, #print-area * {
            visibility: visible;
        }
        #print-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
.label-container {
    border: none !important;
    page-break-inside: avoid;  /* ✅ Chỉ tránh cắt giữa tem */
    break-inside: avoid;
}
    }
</style>
</head>
<body class="p-4 bg-gray-100">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Tạo và In Tem Nhãn</h1>
        <div class="mb-4">
            <label for="inputData" class="block text-sm font-medium text-gray-700">Nhập danh sách mã thiết bị và mô tả lỗi (mỗi dòng: mã + tab + mô tả):</label>
            <textarea id="inputData" rows="10" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"></textarea>
        </div>
        <div class="flex space-x-4 mb-4">
            <button onclick="convertToLabels()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Chuyển đổi sang tem</button>
            <button onclick="printLabels()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">In tem</button>
        </div>
        <div id="print-area" class="grid grid-cols-2 gap-2"></div>
    </div>

    <script>
        function convertToLabels() {
            const input = document.getElementById('inputData').value;
            const lines = input.trim().split('\n');
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';

            lines.forEach((line, index) => {
                const [code, description] = line.split('\t');
                if (code && description) {
                    const label = document.createElement('div');
                    label.className = 'label-container border border-gray-400 p-1';
                    label.style.width = '35mm';
                    label.style.height = '22mm';
                    label.style.fontSize = '10px';
                    label.style.textAlign = 'center';
                    label.style.display = 'flex';
                    label.style.flexDirection = 'column';
                    label.style.justifyContent = 'center';
                    label.innerHTML = `<div class="font-bold">${code.trim()}</div><div>${description.trim()}</div>`;
                    printArea.appendChild(label);
                }
            });
        }

        function printLabels() {
            window.print();
        }
    </script>
</body>
</html>
