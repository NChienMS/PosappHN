<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosApp - Mẫu In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            width: 100%;
        }
        .left-panel {
            width: 20%;
            background-color: #f0f0f0;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #ccc;
        }
        .left-panel h2 {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .left-panel ul {
            list-style: none;
            padding: 0;
        }
        .left-panel li {
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .left-panel li:hover {
            background-color: #ddd;
        }
        .left-panel li.active {
            background-color: #007bff;
            color: white;
        }
        .middle-panel {
            width: 40%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .middle-panel h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .middle-panel pre {
            background-color: #f8f8f8;
            padding: 15px;
            border-radius: 5px;
            flex-grow: 1;
            overflow-y: auto;
            position: relative;
        }
        .middle-panel button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .middle-panel button:hover {
            background-color: #0056b3;
        }
        .right-panel {
            width: 40%;
            padding: 20px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .right-panel h2 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .right-panel img {
            max-width: 100%;
            max-height: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2>Danh sách mẫu in</h2>
            <ul id="template-list">
                <li data-template="template1" class="active">Mẫu hóa đơn 1</li>
                <li data-template="template2">Mẫu hóa đơn 2</li>
                <li data-template="template3">Mẫu hóa đơn 3</li>
            </ul>
        </div>
        <div class="middle-panel">
            <h2>Mã nguồn mẫu in</h2>
            <pre id="code-display"><button onclick="copyCode()">Sao chép</button><code id="code-content">Đang tải...</code></pre>
        </div>
        <div class="right-panel">
            <h2>Xem trước mẫu in</h2>
            <img id="preview-image" src="https://via.placeholder.com/300x400?text=Mau+1" alt="Mẫu in xem trước">
        </div>
    </div>
    <script>
        const templates = {
            template1: {
                file: 'templates/template1.html',
                image: 'https://upload.wikimedia.org/wikipedia/commons/3/39/Meshi.jpg'
            },
            template2: {
                file: 'templates/template2.html',
                image: 'https://via.placeholder.com/300x400?text=Mau+2'
            },
            template3: {
                file: 'templates/template3.html',
                image: 'https://upload.wikimedia.org/wikipedia/commons/3/39/Meshi.jpg'
            }
        };

        async function loadTemplate(template) {
            try {
                const response = await fetch(templates[template].file);
                if (!response.ok) throw new Error('Không tải được file mẫu');
                const content = await response.text();
                document.getElementById('code-content').textContent = content;
                document.getElementById('preview-image').src = templates[template].image;
            } catch (error) {
                document.getElementById('code-content').textContent = 'Lỗi: ' + error.message;
            }
        }

        document.querySelectorAll('#template-list li').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('#template-list li').forEach(li => li.classList.remove('active'));
                item.classList.add('active');
                const template = item.getAttribute('data-template');
                loadTemplate(template);
            });
        });

        function copyCode() {
            const code = document.getElementById('code-content').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Đã sao chép mã nguồn!');
            });
        }

        // Tải mẫu đầu tiên khi trang được mở
        loadTemplate('template1');
    </script>
</body>
</html>
